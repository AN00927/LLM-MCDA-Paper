[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mcda"
version = "0.1.0"
description = "Reproducible evaluation and analysis tools for the LLM-MCDA study."
requires-python = ">=3.11"
dynamic = ["dependencies"]
readme = "README.md"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "calculators*", "architectures*"]

[tool.setuptools]
py-modules = ["run_registry"]

[tool.pytest.ini_options]
pythonpath = ["."]
